[package]
name = "vigil"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
description = "Liveness tile for a fleet of coding agents: is the fleet alive, right now?"
repository = "https://github.com/chussenot/quivive"
license = "MIT"
# `version` is owned by cocogitto and moved only by `cog bump` (docs/conventions.md).
# 0.0.0 is the unreleased placeholder; the first `cog bump` writes a real one.

[dependencies]
# The dependency budget, matching the family's: serde/serde_json, clap,
# clap_complete, chrono, anyhow. Anything else needs a justifying comment here.
#
# chrono, and not a hand-rolled RFC3339: every timestamp vigil reads was written
# by pact as RFC3339 with an offset, and parsing that correctly means offsets,
# leap years and fractional seconds. A hand-rolled parser here would be a source
# of wrong ages, and a wrong age is a wrong state.
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
# The per-tick ceiling in docs/spec.md is a release-profile number, and `bench`
# refuses to assert under debug_assertions. LTO because a tick is dominated by
# JSON parsing across a module boundary.
lto = "thin"
