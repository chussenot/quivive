# A pin nobody updates is just an old action. Every `uses:` in .github/workflows
# is pinned by SHA rather than by tag — a tag is a moving pointer its owner can
# repoint at any commit — and this is what keeps those SHAs current, with the
# human-readable version in the trailing comment moving alongside them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      # Conventional Commits are gated by `cog check` on every PR, so a bot whose
      # subjects do not parse would open PRs that cannot merge.
      prefix: "build"
      include: scope

  # Cargo. This entry predates the crate, and the comment it carried — "with no
  # Cargo.toml, dependabot finds nothing to update rather than erroring" — was a
  # claim written unverified and falsified by the first real run: the 08:41 job
  # aborted with dependency_file_not_found. The crate exists now, so the entry is
  # simply correct; the wrong sentence is recorded in
  # docs/studies/conventions-run.md rather than silently deleted.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: scope
